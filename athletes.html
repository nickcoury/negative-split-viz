<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athletes</title><link rel="stylesheet" href="css/style.css?v=26c4ebe0">
<script src="lib/plotly.min.js"></script></head><body>
<script src="js/common.js?v=16165381"></script>
<main>
<h1>Exploration 8 · Athlete-centric views</h1>
<p class="sub">Who owns even/negative pacing, and how do individuals pace across their careers?</p>

<div class="card"><h3>1 · Repeat even/negative splitters</h3>
  <div class="note">Athletes with the most even-or-negative performances (24h halves + in-race 100mi combined).</div>
  <div id="repeat" class="chart tall"></div></div>

<div class="card"><h3>2 · One athlete's history</h3>
  <div class="controls"><label>Athlete: <select id="pick"></select></label></div>
  <div id="hist" class="chart"></div>
  <div id="tbl" style="overflow:auto"></div></div>

<script>
nav('athletes.html');
loadData().then(({results})=>{
  // combine halves + within, tag context
  const R=results.filter(r=>r.method==='halves'||r.method==='100mi_within_24h');
  // repeat even/neg
  const en={}; R.filter(r=>r.cls!=='positive').forEach(r=>{en[r.name]=(en[r.name]||0)+1;});
  const top=Object.entries(en).filter(([,n])=>n>=2).sort((a,b)=>a[1]-b[1]);
  Plotly.newPlot('repeat',[{y:top.map(t=>t[0]),x:top.map(t=>t[1]),type:'bar',orientation:'h',marker:{color:'#2ec4b6'}}],
    layout({xaxis:{title:'# even/negative performances',dtick:1},margin:{l:150},height:Math.max(420,top.length*24)}),CFG);

  // per-athlete
  const byname={}; R.forEach(r=>{(byname[r.name]=byname[r.name]||[]).push(r);});
  const multi=Object.entries(byname).filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length);
  const sel=document.getElementById('pick');
  sel.innerHTML=multi.map(([n,v])=>`<option>${n} (${v.length})</option>`).join('');
  function show(name){
    const v=byname[name]||[];
    Plotly.react('hist',[{x:v.map(r=>r.year+(r.method==='100mi_within_24h'?0.15:0)),y:v.map(r=>r.split),
      mode:'markers',type:'scatter',marker:{size:11,color:v.map(r=>CLS_COLOR[r.cls]),
        symbol:v.map(r=>r.method==='100mi_within_24h'?'diamond':'circle'),line:{width:1,color:'#0f1419'}},
      text:v.map(r=>`${r.year} ${r.series}<br>${r.method==='100mi_within_24h'?'in-race 100mi':'24h halves'} · ${r.split>0?'+':''}${r.split}% (${r.cls})`),hoverinfo:'text'}],
      layout({xaxis:{title:'year'},yaxis:{title:'split %',zeroline:true},title:{text:'○ 24h halves   ◇ in-race 100mi',font:{size:11},x:0}}),CFG);
    const rowsH=v.sort((a,b)=>a.year-b.year).map(r=>`<tr><td>${r.year}</td><td>${r.series}</td><td>${r.method==='100mi_within_24h'?'100mi-in-24h':'24h'}</td><td style="color:${CLS_COLOR[r.cls]}">${r.split>0?'+':''}${r.split}%</td><td>${r.cls}</td><td>${r.place??''}</td></tr>`).join('');
    document.getElementById('tbl').innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:#93a1b0;text-align:left"><th>Year</th><th>Event</th><th>Metric</th><th>Split</th><th>Class</th><th>Place</th></tr>${rowsH}</table>`;
  }
  sel.onchange=e=>show(e.target.value.replace(/ \(\d+\)$/,''));
  show(multi[0][0]);
});
</script>
</main></body></html>
